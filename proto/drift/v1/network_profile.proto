syntax = "proto3";
package drift.v1;

import "drift/v1/common.proto";

option go_package = "drift.local/drift-next/gen/go/drift/v1;driftv1";

message NetworkProfile {
  string id = 1;
  WorkspaceRef workspace = 2;
  string display_name = 3;
  string address_policy = 4;
  repeated uint32 allowed_ports = 5;
  bool is_default = 6;
  reserved 7, 8;
  reserved "state", "row_version";
}
message ListNetworkProfilesRequest {
  WorkspaceRef workspace = 1;
  PageRequest page = 2;
}
message ListNetworkProfilesResponse {
  repeated NetworkProfile profiles = 1;
  PageResponse page = 2;
}
message CreateNetworkProfileRequest {
  RequestContext context = 1;
  NetworkProfile profile = 2;
}
message CreateNetworkProfileResponse {
  NetworkProfile profile = 1;
}
message UpdateNetworkProfileRequest {
  RequestContext context = 1;
  NetworkProfile profile = 2;
  reserved 3;
  reserved "expected_row_version";
}
message UpdateNetworkProfileResponse {
  NetworkProfile profile = 1;
}
service NetworkProfileService {
  rpc ListNetworkProfiles(ListNetworkProfilesRequest) returns (ListNetworkProfilesResponse);
  rpc CreateNetworkProfile(CreateNetworkProfileRequest) returns (CreateNetworkProfileResponse);
  rpc UpdateNetworkProfile(UpdateNetworkProfileRequest) returns (UpdateNetworkProfileResponse);
}
