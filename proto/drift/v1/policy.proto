syntax = "proto3";
package drift.v1;

import "drift/v1/common.proto";

option go_package = "drift.local/drift-next/gen/go/drift/v1;driftv1";

enum PolicyDecision {
  POLICY_DECISION_UNSPECIFIED = 0;
  POLICY_DECISION_ALLOW = 1;
  POLICY_DECISION_DENY = 2;
  POLICY_DECISION_INCONCLUSIVE = 3;
}
message Policy {
  string id = 1;
  WorkspaceRef workspace = 2;
  string display_name = 3;
  uint32 version = 4;
  string state = 5;
  string rule_json = 6;
  uint64 row_version = 7;
  string created_at = 8;
  string updated_at = 9;
}
message PolicyDecisionRecord {
  string id = 1;
  string policy_id = 2;
  string resource_type = 3;
  string resource_id = 4;
  string action = 5;
  PolicyDecision decision = 6;
  string reason_code = 7;
  string correlation_id = 8;
  string decided_at = 9;
  string actor_id = 10;
}
message ListPoliciesRequest {
  WorkspaceRef workspace = 1;
  PageRequest page = 2;
}
message ListPoliciesResponse {
  repeated Policy policies = 1;
  PageResponse page = 2;
}

message CreatePolicyVersionRequest {
  RequestContext context = 1;
  ResourceRef base_policy = 2;
  string rule_json = 3;
}

message CreatePolicyVersionResponse {
  Policy policy = 1;
}

message ActivatePolicyRequest {
  RequestContext context = 1;
  ResourceRef policy = 2;
  uint64 expected_row_version = 3;
}

message ActivatePolicyResponse {
  Policy policy = 1;
}

message RetirePolicyRequest {
  RequestContext context = 1;
  ResourceRef policy = 2;
  uint64 expected_row_version = 3;
}

message RetirePolicyResponse {
  Policy policy = 1;
}

message ListPolicyDecisionsRequest {
  WorkspaceRef workspace = 1;
  string resource_type = 2;
  PageRequest page = 3;
}

message ListPolicyDecisionsResponse {
  repeated PolicyDecisionRecord decisions = 1;
  PageResponse page = 2;
}

service PolicyService {
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc CreatePolicyVersion(CreatePolicyVersionRequest) returns (CreatePolicyVersionResponse);
  rpc ActivatePolicy(ActivatePolicyRequest) returns (ActivatePolicyResponse);
  rpc RetirePolicy(RetirePolicyRequest) returns (RetirePolicyResponse);
  rpc ListPolicyDecisions(ListPolicyDecisionsRequest) returns (ListPolicyDecisionsResponse);
}
