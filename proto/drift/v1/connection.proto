syntax = "proto3";

package drift.v1;

import "drift/v1/common.proto";

option go_package = "drift.local/drift-next/gen/go/drift/v1;driftv1";

// ConnectionService exposes the transport operations the console's OTG Setup tab
// performs, so each one is reachable from the operator surface instead of
// existing only as tested Go code.
//
// ConnectEndpoint, ActivateFleet and RestartServer are the operations that
// surface offers. ChangeTransportMode and ActivatePort remain published here as
// the per-device forms: ActivateFleet is exactly ChangeTransportMode applied
// over the discovered fleet — it is not a second way to move a device to a port,
// and a client that names one device by serial still uses the single-device form.
// They are kept rather than retired because removing a published RPC is a
// breaking change that needs a compatibility strategy, and no client is entitled
// to less than it was published.
//
// NONE OF THESE REQUESTS CARRIES A WorkspaceRef, and that is deliberate rather
// than an omission. `adb kill-server` and `adb start-server` are process-global:
// a restart's blast radius is every transport the server holds, including
// devices outside any one workspace's fleet. It is a HOST operation, and scoping
// it to a workspace would let an operator read it as a fleet operation — which
// is exactly the misreading that produced this card's measured finding that a
// restart de-authorized a device nobody had selected. The operations that do
// touch one device name it by serial, which is the device's stable identity,
// rather than by any workspace ambient to the request.
//
// Every request carries a RequestContext, and one without a request_id is
// refused before anything is run: the request id is the correlation identity of
// the call, and by this repository's convention at the product boundary it is
// also the actor of record when no actor_id is supplied.

// EndpointOutcome is one endpoint's result inside a restart report. It is
// reported PER ENDPOINT because an aggregate verdict hides which device was left
// unreachable: if fourteen endpoints recover and one does not, the one has to be
// named, with its reason.
message EndpointOutcome {
  string endpoint = 1;
  uint32 port = 2;
  bool reestablished = 3;
  int32 exit_code = 4;
  // reason is the refusal or failure that kept this endpoint down, and is empty
  // when it came back. It is a safe classified sentence, never raw command text.
  string reason = 5;
}

message ConnectEndpointRequest {
  RequestContext context = 1;
  // serial names the device the transport is opened for. It is what lets the
  // port decision honour a port activation the operator made for THAT device:
  // the same endpoint carries no such meaning on its own.
  string serial = 2;
  // endpoint is a canonical IPv4:port. Its port is a discovered fact that the
  // profile's port policy decides on at connect time, so an off-port endpoint is
  // refused here and named in the refusal.
  string endpoint = 3;
}

message ConnectEndpointResponse {
  string endpoint = 1;
  uint32 port = 2;
  int32 exit_code = 3;
  // output is the adapter's own redacted, bounded report of what it did.
  string output = 4;
}

message ChangeTransportModeRequest {
  RequestContext context = 1;
  // serial is the device whose transport mode is changed. It is required: the
  // change restarts that device's adbd, and a device command whose subject is
  // whoever happens to be attached is worse than no command at all.
  string serial = 2;
  // port is where adbd will listen. It is a TCP port, not a profile bound: the
  // profile's accepted ports decide at connect time, not here.
  uint32 port = 3;
}

// ChangeTransportModeResponse reports the state read BEFORE the change and the
// state read AFTER it, because restarting adbd does not leave a device as it
// found it.
message ChangeTransportModeResponse {
  string serial = 1;
  uint32 port = 2;
  string state_before = 3;
  string connection_before = 4;
  string state_after = 5;
  // needs_operator_authorization is true when the device came back unauthorized
  // for this host. It is an OUTCOME and not an error: the change happened, and
  // what it needs next is a person accepting the debugging prompt on the
  // device's screen, not a retry.
  bool needs_operator_authorization = 6;
  // message is the sentence an operator is meant to read, naming the device and
  // what it needs.
  string message = 7;
  int32 exit_code = 8;
}

message ActivatePortRequest {
  RequestContext context = 1;
  string serial = 2;
  // endpoint is the OBSERVED IPv4:port of the device being enabled. Activating a
  // port the device does not answer on is not this operation: use
  // ChangeTransportMode to move a device to a port.
  string endpoint = 3;
}

message ActivatePortResponse {
  string serial = 1;
  string endpoint = 2;
  uint32 port = 3;
  // changed separates "activated" from "already accepted". Reporting the second
  // as the first claims credit for something that did not happen.
  bool changed = 4;
  string activated_at = 5;
}

message RestartServerRequest {
  RequestContext context = 1;
  // endpoints are the transports to re-establish after the server comes back,
  // in the order they are given: operator order is carried rather than left to
  // timing. At least one is required, because dropping the server with nothing
  // to restore strands every device it holds.
  repeated string endpoints = 2;
}

message RestartServerResponse {
  uint32 transports_before = 1;
  // transports_after_start_known distinguishes "the server holds nothing" from
  // "the count could not be read": a restart that could not measure its result
  // must not report zero, which is a claim about the fleet rather than about the
  // reading.
  bool transports_after_start_known = 2;
  uint32 transports_after_start = 3;
  int32 kill_exit_code = 4;
  bool kill_failed = 5;
  int32 start_exit_code = 6;
  bool start_failed = 7;
  uint32 reestablished = 8;
  uint32 failed = 9;
  repeated EndpointOutcome endpoints = 10;
}

// FleetActivationOutcome is ONE device's result inside a fleet activation. It is
// reported per serial because an aggregate verdict hides which device was left
// without a transport: if thirteen devices come up and one is refused, the one
// has to be named, with its own reason and its own sentence.
message FleetActivationOutcome {
  string serial = 1;
  uint32 port = 2;
  // activated is true only when this device's transport mode was changed AND it
  // came back able to accept this host.
  bool activated = 3;
  // already_on_port is true when the device was already answering on the target
  // port, so nothing was sent for it. Nothing is activated by reporting it as
  // activated.
  bool already_on_port = 4;
  // refusal names the precondition that failed, and is empty when none did:
  // not_attached | not_authorized | not_usb. It is a stable classified reason,
  // not prose, so a client can branch on it.
  string refusal = 5;
  // message is the sentence an operator reads for THIS serial, naming the device
  // and what it needs. It is a safe classified sentence, never raw command text.
  string message = 6;
  // needs_operator_authorization is true when the change happened and the device
  // came back unauthorized for this host. It is an OUTCOME and not an error: what
  // it needs next is a person accepting the debugging prompt on the device's
  // screen, not a retry.
  bool needs_operator_authorization = 7;
  string state_before = 8;
  // state_after is empty for a device whose transport mode was never changed.
  string state_after = 9;
  int32 exit_code = 10;
  // failed is true when the change ran for this device and failed. It is its own
  // answer because a client reading only activated/refusal/already_on_port would
  // have to infer a failure from the absence of them, and a device whose state is
  // unknown must not read as one that was simply not mentioned.
  bool failed = 11;
}

// ActivateFleetRequest names one port and nothing else. It deliberately carries
// NO device list: the fleet is read from the devices by the control plane, so an
// operator action cannot assert which devices are attached, and a client cannot
// pick a subject for a command it does not own.
message ActivateFleetRequest {
  RequestContext context = 1;
  // port is where each device's adbd will listen. It is a TCP port, not a
  // profile bound: the profile's accepted ports decide at connect time, not
  // here. The operator surface defaults it to 5555.
  uint32 port = 2;
}

// ActivateFleetResponse reports the fleet per device and, separately, the counts
// that make a bare "ok" impossible. The counts never stand in for the per-device
// outcomes: a client renders both.
message ActivateFleetResponse {
  uint32 port = 1;
  // activated counts the devices that were moved onto the port and are usable.
  uint32 activated = 2;
  // needs_operator_authorization counts the devices that were moved onto the
  // port and are waiting for a person.
  uint32 needs_operator_authorization = 3;
  // refused counts the devices the transport-mode gate refused before anything
  // ran for them.
  uint32 refused = 4;
  // failed counts the devices whose change ran and failed.
  uint32 failed = 5;
  // already_on_port counts the devices that were not touched because they
  // already answer on the port.
  uint32 already_on_port = 6;
  // devices carries every outcome, in the order the devices reported themselves.
  repeated FleetActivationOutcome devices = 7;
}

service ConnectionService {
  rpc ConnectEndpoint(ConnectEndpointRequest) returns (ConnectEndpointResponse);
  rpc ChangeTransportMode(ChangeTransportModeRequest) returns (ChangeTransportModeResponse);
  rpc ActivatePort(ActivatePortRequest) returns (ActivatePortResponse);
  rpc RestartServer(RestartServerRequest) returns (RestartServerResponse);
  // ActivateFleet moves every discovered device that is not already answering on
  // the port onto it. It is the OTG Setup tab's Activate control: one operator
  // action over the fleet, one result per serial.
  rpc ActivateFleet(ActivateFleetRequest) returns (ActivateFleetResponse);
}
