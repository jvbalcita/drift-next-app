syntax = "proto3";
package drift.v1;

import "drift/v1/common.proto";

option go_package = "drift.local/drift-next/gen/go/drift/v1;driftv1";

// Reserved by the discovery simplification. These declarations were published
// and then removed, so their names and numbers must never be reused:
//   enum ScanCandidateState { SCAN_CANDIDATE_STATE_UNSPECIFIED = 0; ..._REGISTERED = 6 }
//   message ScanCandidate { 1..11 }
//   message DecideScanCandidateRequest { 1..4 }
//   message DecideScanCandidateResponse { 1 }
//   message RegisterScanCandidateRequest { 1..3 }
//   message RegisterScanCandidateResponse { 1..3 }
//   message ListScanCandidatesRequest { 1..2 }
//   message ListScanCandidatesResponse { 1..2 }
//   rpc DecideScanCandidate, rpc RegisterScanCandidate, rpc ListScanCandidates

enum ScanRunState {
  SCAN_RUN_STATE_UNSPECIFIED = 0;
  SCAN_RUN_STATE_REQUESTED = 1;
  SCAN_RUN_STATE_RUNNING = 2;
  SCAN_RUN_STATE_COMPLETED = 3;
  SCAN_RUN_STATE_FAILED = 4;
  SCAN_RUN_STATE_CANCELLED = 5;
}

// DeviceLinkState is the observed transport state of a scanned device. It is a
// fact about the current link, not a lifecycle an operator must advance: an
// offline or unauthorized device is reported as such and is not actionable.
//
// NO_PERMISSIONS is a transport this host may not open at all, and it is the
// scan surface's counterpart of DeviceStatus.DEVICE_STATUS_NO_PERMISSIONS. It is
// deliberately NOT the same value as UNAUTHORIZED: one is fixed on the host's
// permission rule and the other on the device's own display, so a consumer told
// only "unauthorized" would send an operator to the wrong side of the cable. It
// was added after this enum shipped, so every value above it keeps its number
// and no retired number is reused (the reservations above bind that).
enum DeviceLinkState {
  DEVICE_LINK_STATE_UNSPECIFIED = 0;
  DEVICE_LINK_STATE_ONLINE = 1;
  DEVICE_LINK_STATE_OFFLINE = 2;
  DEVICE_LINK_STATE_UNAUTHORIZED = 3;
  DEVICE_LINK_STATE_NO_PERMISSIONS = 4;
}

message ScanRun {
  string id = 1;
  WorkspaceRef workspace = 2;
  string network_profile_id = 3;
  ScanRunState state = 4;
  string requested_at = 5;
  string finished_at = 6;
  Failure failure = 7;
}

// ObservedDevice is one device a scan saw. device_id and endpoint_id are set
// once the serial is already known in this workspace, so a known device keeps
// its stable device identity while its endpoint stays mutable transport fact.
message ObservedDevice {
  string host = 1;
  uint32 port = 2;
  string serial = 3;
  string model = 4;
  DeviceLinkState state = 5;
  bool known = 6;
  string device_id = 7;
  string endpoint_id = 8;
  string device_name = 9;
}

message StartScanRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  string network_profile_id = 3;
}
message StartScanResponse {
  ScanRun scan_run = 1;
  repeated ObservedDevice devices = 2;
}
// StartRangeScanRequest names a range the operator ENTERED, and nothing saved:
// the OTG Setup tab's Scan scans what was typed into its IP Range inputs, so its
// target is the entered range rather than the Saved network control's profile.
// address_policy carries the same inclusive `start-end` spelling a saved profile
// with a range policy stores, so one entered range has one spelling whichever
// control names it.
message StartRangeScanRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  // The entered inclusive IPv4 range, spelled `start-end`.
  string address_policy = 3;
  // The single port the entered range is observed for.
  uint32 port = 4;
}
message StartRangeScanResponse {
  ScanRun scan_run = 1;
  repeated ObservedDevice devices = 2;
}
message ListScanRunsRequest {
  WorkspaceRef workspace = 1;
  PageRequest page = 2;
}
message ListScanRunsResponse {
  repeated ScanRun scan_runs = 1;
  PageResponse page = 2;
}
service DiscoveryService {
  rpc StartScan(StartScanRequest) returns (StartScanResponse);
  // StartRangeScan runs one scan of the range an operator entered. It is a
  // second target, not a second way to scan a saved profile: the run records no
  // profile reference, because the range it scanned is not saved policy.
  rpc StartRangeScan(StartRangeScanRequest) returns (StartRangeScanResponse);
  rpc ListScanRuns(ListScanRunsRequest) returns (ListScanRunsResponse);
}
