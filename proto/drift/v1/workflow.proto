syntax = "proto3";
package drift.v1;

import "drift/v1/common.proto";

option go_package = "drift.local/drift-next/gen/go/drift/v1;driftv1";

enum WorkflowState {
  WORKFLOW_STATE_UNSPECIFIED = 0;
  WORKFLOW_STATE_DRAFT = 1;
  WORKFLOW_STATE_VALIDATED = 2;
  WORKFLOW_STATE_PUBLISHED = 3;
  WORKFLOW_STATE_DEPRECATED = 4;
  WORKFLOW_STATE_RETIRED = 5;
}
message Workflow {
  string id = 1;
  WorkspaceRef workspace = 2;
  string display_name = 3;
  WorkflowState state = 4;
  uint64 row_version = 5;
  string published_version_id = 6;
  uint32 published_version = 7;
  string latest_version_id = 8;
  uint32 latest_version = 9;
  WorkflowState latest_version_state = 10;
}
message WorkflowVersion {
  string id = 1;
  string workflow_id = 2;
  uint32 version = 3;
  WorkflowState state = 4;
}
message ListWorkflowsRequest {
  WorkspaceRef workspace = 1;
  PageRequest page = 2;
}
message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
  PageResponse page = 2;
}
message CreateWorkflowRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  string display_name = 3;
}
message CreateWorkflowResponse {
  Workflow workflow = 1;
  WorkflowVersion version = 2;
}
message PublishWorkflowVersionRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  string version_id = 3;
}
message PublishWorkflowVersionResponse {
  WorkflowVersion version = 1;
}
service WorkflowService {
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse);
  rpc PublishWorkflowVersion(PublishWorkflowVersionRequest) returns (PublishWorkflowVersionResponse);
}
