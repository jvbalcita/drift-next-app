syntax = "proto3";

package drift.v1;

import "drift/v1/common.proto";

option go_package = "drift.local/drift-next/gen/go/drift/v1;driftv1";

// The live mirror surface: one device's screen carried to the console as it is
// encoded, with input travelling the same session's control socket.
//
// It is deliberately smaller than it looks. Input is NOT here. Tap, swipe, key
// event and typed text are already first-class typed actions on DeviceInputService,
// where the lease, fencing, policy, control-session and emergency-stop kernel
// authorizes them, and a second input contract on this service would be a second
// representation of a device input with a second authorization story. What this
// service owns is the one thing that surface cannot express: the stream's own
// lifecycle - opening a device's live session, negotiating the transport with a
// browser, and ending it.
//
// Where the frames come from is not in this contract at all, and that is
// deliberate. The browser is given a stream identity, the frame size the stream
// is encoded at, and a transport to negotiate; it is never given a device
// address, an adb serial, a media-server URL or a stream path to reach directly.
// Every byte it receives comes back through this service's own surface.
//
// The transport field states the transport a stream IS using, and the request
// field states the transport the operator asked for. Both transports work: a
// requested transport this service cannot carry is refused rather than silently
// replaced, so a caller never believes it is receiving something other than what
// it asked for.

// MirrorTransport names how a device's live stream reaches a browser.
enum MirrorTransport {
  MIRROR_TRANSPORT_UNSPECIFIED = 0;
  // WebRTC (pion) inside the control plane: the stream is negotiated with a
  // peer connection and pushed to it. The default when nothing is asked for.
  MIRROR_TRANSPORT_WEBRTC = 1;
  // The TCP compatibility path: the stream is pulled from this service's own
  // stream endpoint (stream_url) as fragmented MP4 and played as MSE. It is
  // chosen for compatibility - the path a browser without a working WebRTC
  // stack can still show - and it is slower than the WebRTC path by design.
  MIRROR_TRANSPORT_TCP = 2;
}

// MirrorStreamState is the state an operator surface renders.
//
// STARTING is a stream whose capture is opening or whose browser has not yet
// produced a picture. It is deliberately distinct from LIVE: a connection that is
// up and showing nothing is not a picture, and this fleet's encoder will happily
// produce a connected-but-black stream with no error anywhere.
enum MirrorStreamState {
  MIRROR_STREAM_STATE_UNSPECIFIED = 0;
  MIRROR_STREAM_STATE_STARTING = 1;
  MIRROR_STREAM_STATE_LIVE = 2;
  MIRROR_STREAM_STATE_ENDED = 3;
  MIRROR_STREAM_STATE_FAILED = 4;
}

// MirrorStream is one device's live stream as the console sees it.
//
// It carries the render size the stream is encoded at, which is the coordinate
// frame an operator's tap must be measured in - the `wm size` override, never the
// physical panel size and never a downscaled canvas. A console that renders the
// stream at another size has to map coordinates back into this frame; a
// coordinate measured in another frame is refused (AGENTS.md section 3).
message MirrorStream {
  // stream_id is the identity of ONE VIEWING of a device's live stream, and it
  // is the only handle the browser is given for the frames it is about to
  // receive.
  //
  // It is minted per viewing and never shared. One device is captured once and
  // its session carries the same frames to every viewer of it, but two viewers
  // are two of these - so a caller can only ever name its own: a stop ends the
  // viewing it names, a negotiation attaches the browser holding it, a poll
  // reports what THAT browser was carried, and the stream endpoint a fetched
  // viewer pulls is the one its own identity names. What outlives a single
  // viewing is the device's SESSION, which ends when its last viewer has
  // detached for the plane's idle bound.
  string stream_id = 1;
  string device_id = 2;
  MirrorTransport transport = 3;
  uint32 render_width = 4;
  uint32 render_height = 5;
  MirrorStreamState state = 6;
  // failure is the plane's own sentence about why this stream is not live: the
  // transport's error, the adapter's, or the plane's own classification of how
  // the session ended. It is empty while the stream is live, and a state of
  // FAILED always carries one - the boundary that states the state fills it in
  // from the end class when no carrier had words of its own, because a frame
  // that shows nothing is diagnosable only from what it was told.
  //
  // A state of ENDED carries none, and that is deliberate rather than an
  // omission: ENDED means the stream stopped without failing - the viewing this
  // identity names ended because its viewer detached, or the device's capture
  // ended because its last one did - and the sentence an operator needs there -
  // that the picture they are looking at is the last one it carried rather than
  // the device's screen now - is about the frame, which the plane does not own.
  string failure = 7;
  // frames and key_frames are the pictures this stream has carried to this
  // browser. They are what "live" is asserted on: never the connection state.
  uint64 frames = 8;
  uint64 key_frames = 9;
  // stream_url is the per-device stream endpoint a browser fetches when the
  // transport is TCP. It is a path on this service's own guarded surface, and it
  // is the ONLY thing a browser is given to reach the frames: never a device
  // address, an adb serial, an RTSP address or a media-server control URL. It is
  // empty for a stream carried over WebRTC, which is negotiated with
  // NegotiateMirrorStream instead.
  string stream_url = 10;
  // bytes is the encoded access-unit payload this viewing has carried. It is
  // bounded accounting, not a media buffer: no frame history is retained for it.
  uint64 bytes = 11;
  // started_at_unix_millis is when this viewing's carrier opened. Together with
  // last_frame_at_unix_millis it makes carrier activity span and current frame
  // age measurable without asking a browser to infer either from a frame count.
  int64 started_at_unix_millis = 12;
  // last_frame_at_unix_millis is when the carrier most recently forwarded a
  // picture. Zero means no picture has been forwarded yet.
  int64 last_frame_at_unix_millis = 13;
  // connection_state is the carrier's own bounded transport state. WebRTC uses
  // the peer connection state; compatibility transports may leave it empty.
  string connection_state = 14;
}

// MirrorViewerPurpose is what a viewer of a device's live stream IS, and it is
// the fact the plane's device-session capacity is spent against.
//
// One service carries two very different demands. The console's grid draws
// ambient tiles: a fleet VIEW, one stream per tile, bounded so that a fleet view
// stays a view rather than a wall of simultaneous captures. The operator's big
// frame is the surface a device is worked from, and a frame that cannot open
// because the grid is already holding every session is a control room whose
// pictures cannot be touched. The plane therefore keeps a place below its
// capacity for the operator's own frame and refuses an AMBIENT viewer once the
// grid's share of the capacity is spent.
//
// The same fact decides the ENCODE BOUND, and the two are deliberately one field
// rather than two: what a viewer is decides both how much of the plane's capacity
// it may spend and how the stream it is shown is encoded (see
// MirrorPreviewQuality). A second field would be a second statement of the same
// thing, and the two could disagree.
//
// A request that states neither is read as the operator's own frame, because the
// two mistakes are not equal: an undeclared viewer read as the grid loses the
// operator a place, while one read as the operator's frame can only spend a place
// that was held for exactly it.
enum MirrorViewerPurpose {
  MIRROR_VIEWER_PURPOSE_UNSPECIFIED = 0;
  // AMBIENT is one of the console's grid tiles: a picture and nothing else.
  MIRROR_VIEWER_PURPOSE_AMBIENT = 1;
  // OPERATOR is the operator's own big frame: where a device is worked from.
  MIRROR_VIEWER_PURPOSE_OPERATOR = 2;
}

// MirrorPreviewQuality is the workspace's preview level: the bound the console's
// grid is carried at.
//
// It is a HARD CAP per level and not a hint - each level states the largest size
// the device's encoder may produce and the video bit rate it may spend - because
// the state this contract removes is an encoder nothing bounded. Measured on the
// owner's host before this contract existed: the live launch carried no
// max_size, no max_fps and no video_bit_rate at all, the device encoded at its
// native 1080x1920 at 60 fps with scrcpy's own default bit rate, and two live
// native-resolution streams put 0.9 Mbps on the wire while their screens sat idle
// - so the cost is in MOTION, and an uncapped worst case is unbounded rather than
// merely large.
//
// It bounds AMBIENT viewers only. The operator's own frame is carried at its own
// profile whatever is stated here, because a level an operator chose for a grid of
// thumbnails must never make the frame they work in blurry.
enum MirrorPreviewQuality {
  // UNSPECIFIED states no setting, and the plane applies the setting it is
  // configured with - which is itself a level with a cap, never "no bound".
  MIRROR_PREVIEW_QUALITY_UNSPECIFIED = 0;
  // LOW is 480p at 0.5 Mbps.
  MIRROR_PREVIEW_QUALITY_LOW = 1;
  // MEDIUM is 720p at 1.2 Mbps. It is the level an unstated or unrecognised
  // setting resolves to: the plane's default capacity lets the grid carry
  // several tiles at once, and the levels above this one are per-stream costs a
  // grid multiplies.
  MIRROR_PREVIEW_QUALITY_MEDIUM = 2;
  // HIGH is 1080p at 2.5 Mbps.
  MIRROR_PREVIEW_QUALITY_HIGH = 3;
  // EXTRA is the device's own size at 6 Mbps: native, and still bounded by the
  // bit rate.
  MIRROR_PREVIEW_QUALITY_EXTRA = 4;
}

// MirrorTileBound names WHICH of a plane's two tile bounds decided how many live
// tile pictures it carries, and it is on the wire because the two are not
// interchangeable to an operator reading a frame.
//
// A grid that carries three tiles because the deployment keeps one of its four
// sessions for the operator's own frame is a different situation from one that
// carries three because a stream at the plane's preview quality costs a quarter
// of the transport budget it stated. The second is answered by choosing a cheaper
// quality or stating a bigger budget and the first is not, so a surface that was
// told only the count would send an operator looking in the wrong place.
//
// UNSPECIFIED states no bound, and it is the honest answer for a plane that
// published no per-stream cost: a reader must not be told the transport decided a
// count that was derived from the session share.
enum MirrorTileBound {
  MIRROR_TILE_BOUND_UNSPECIFIED = 0;
  // SESSION_SHARE: the grid holds everything the plane has left after the
  // operator's reserve. The plane is simply full.
  MIRROR_TILE_BOUND_SESSION_SHARE = 1;
  // TRANSPORT_BUDGET: the preview quality's per-stream cost does not fit the
  // deployment's stated transport budget for as many tiles as the session share
  // would allow, so the grid carries fewer.
  MIRROR_TILE_BOUND_TRANSPORT_BUDGET = 2;
}

// MirrorCapacity is the plane's own device-session bound, as the deployment
// stated it, together with the place its ambient viewers may not spend.
//
// It is published rather than agreed, and that is the whole point: the console's
// tile allocation used to be a constant of its own that happened to hold the same
// number as the plane's bound, so the two could agree by luck and disagree by
// edit. The console now derives how many tiles subscribe from THIS, which is the
// bound the plane is actually carrying.
message MirrorCapacity {
  // session_capacity is how many devices this plane mirrors at once.
  uint32 session_capacity = 1;
  // operator_reserve is how many of session_capacity are kept for the
  // operator's own frame: the grid may hold at most
  // session_capacity - operator_reserve tiles between them.
  uint32 operator_reserve = 2;
  // preview_quality is the level this plane's AMBIENT streams are carried at -
  // the console's grid tiles - and it is the profile the plane's transport budget
  // is spent at. It is published because it is not a cosmetic choice: the plane
  // budgets `session_capacity x bitrate(level)` against the transport its streams
  // share, so a more expensive level buys FEWER tile pictures rather than
  // oversubscribing the path. A console that drew its grid without knowing this
  // would ask for more pictures than the plane will carry and report the plane's
  // refusal as a failure.
  //
  // It is the plane's own setting rather than the level a viewer requests, which
  // is a field of its own on StartMirrorStreamRequest: a reader asking what this
  // plane's grid costs reads the plane's answer here.
  //
  // UNSPECIFIED is deliberately not a level: a plane that publishes it has not
  // stated what its streams cost, and a reader must not treat "unstated" as a
  // cheap profile. The operator's own frame is carried at its own profile
  // whatever is stated here and is not priced by this field.
  MirrorPreviewQuality preview_quality = 3;
  // preview_bitrate_kbps is what ONE live stream at preview_quality costs the
  // transport, in kilobits per second. It is stated rather than left for a reader
  // to look up, because the table it comes from is the device encoder's, and a
  // console that kept a second copy of it could budget against a cost no stream
  // is being produced at.
  uint32 preview_bitrate_kbps = 4;
  // transport_budget_kbps is the aggregate live-stream budget this deployment
  // states for the transport its streams share. It is a deployment input rather
  // than a property of the plane: it is what this host's path has been measured
  // to carry.
  uint32 transport_budget_kbps = 5;
  // transport_spend_kbps is what this plane would put on that transport with
  // every one of its session places live at preview_quality: session_capacity x
  // preview_bitrate_kbps. It is stated beside the budget so a deployment can be
  // read back - a spend above the budget is a plane whose grid has to carry fewer
  // pictures, and both numbers are in the same message.
  uint32 transport_spend_kbps = 6;
  // tile_places is how many live tile pictures this preview quality and this
  // capacity allow: session_capacity less operator_reserve, and less whatever the
  // transport budget cannot carry at the quality's per-stream cost, whichever is
  // smaller. It is the plane's own answer to "how many live tiles does this
  // profile and this capacity allow", derived once here rather than recomputed by
  // every surface that draws a grid - and it is what a tile the grid's bound does
  // not reach is explained by.
  uint32 tile_places = 7;
  // tile_bound is WHICH of the two bounds decided tile_places, so a grid carrying
  // fewer tiles than its session share can say why in the plane's own numbers (see
  // MirrorTileBound).
  MirrorTileBound tile_bound = 8;
}

// StartMirrorStreamRequest opens one device's live stream for one viewer.
message StartMirrorStreamRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  string device_id = 3;
  // transport is the transport the caller asks for. UNSPECIFIED selects the
  // default, which is WebRTC. A transport this service cannot carry is refused
  // rather than silently replaced, so a caller never believes it is receiving
  // something other than what it asked for.
  MirrorTransport transport = 4;
  // purpose is what this viewer is. UNSPECIFIED is read as the operator's own
  // frame (see MirrorViewerPurpose), so a caller that has not been taught the
  // distinction is treated as the surface that must not be refused on the
  // grid's account.
  MirrorViewerPurpose purpose = 5;
  // preview_quality is the workspace's preview level as the caller states it: a
  // hard cap on the size and the bit rate of the stream this viewer is shown.
  //
  // It is stated rather than read from the plane so that the operator's own
  // setting reaches the encoder that applies it, and it bounds an AMBIENT viewer
  // only - the operator's own frame is carried at its own profile whatever is
  // stated here. UNSPECIFIED, and any level this plane does not know, resolve to
  // the setting the plane is configured with rather than to no bound at all.
  MirrorPreviewQuality preview_quality = 6;
  // frame_rate is the workspace's preview frame rate, in frames per second. It
  // is the range the console's own control offers (1-24), and it bounds an
  // AMBIENT viewer's stream exactly as preview_quality does.
  //
  // Zero states no rate, and a rate outside the range is not applied: both
  // resolve to the rate the plane is configured with, because a stream bounded by
  // a number nobody chose is the defect this field removes.
  uint32 frame_rate = 7;
}

message StartMirrorStreamResponse {
  MirrorStream stream = 1;
}

// NegotiateMirrorStreamRequest carries a browser's SDP offer for one stream.
message NegotiateMirrorStreamRequest {
  RequestContext context = 1;
  // stream_id names the VIEWING being attached. A device carried to several
  // viewers has one of these per viewer, so a handshake can only ever be
  // negotiated against the stream its own browser was handed - never against
  // another viewer's stream of the same device.
  string stream_id = 2;
  string offer_sdp = 3;
  // The workspace that opened this viewing. Negotiation checks it together
  // with the actor against the claim bound when the stream was opened.
  WorkspaceRef workspace = 4;
}

message NegotiateMirrorStreamResponse {
  string answer_sdp = 1;
  MirrorStream stream = 2;
}

// StopMirrorStreamRequest ends the viewing that holds one stream identity.
//
// A stop is a VIEWER DETACH, not a capture-wide operation, and the identity is
// what makes it one: it names a single viewing, so the session stops carrying
// THIS browser and leaves every other viewer of the same device alone. The
// device's capture ends when its LAST viewer has detached for the plane's idle
// bound, which is the end an unsubscribed device already had.
message StopMirrorStreamRequest {
  RequestContext context = 1;
  string stream_id = 2;
}

message StopMirrorStreamResponse {
  MirrorStream stream = 1;
}

// GetMirrorStreamRequest polls one stream's state while the console shows it.
message GetMirrorStreamRequest {
  string stream_id = 1;
}

message GetMirrorStreamResponse {
  MirrorStream stream = 1;
}

// GetMirrorCapacityRequest asks how much room this plane has for streams.
message GetMirrorCapacityRequest {
  WorkspaceRef workspace = 1;
}

message GetMirrorCapacityResponse {
  MirrorCapacity capacity = 1;
}

service DeviceMirrorService {
  rpc StartMirrorStream(StartMirrorStreamRequest) returns (StartMirrorStreamResponse);
  rpc NegotiateMirrorStream(NegotiateMirrorStreamRequest) returns (NegotiateMirrorStreamResponse);
  // StopMirrorStream ends ONE VIEWING of a device's live stream: it detaches the
  // browser holding the identity and leaves every other viewer of that device
  // alone. The device's capture ends with its last viewer, on the plane's idle
  // bound, and never on one viewer's departure while another is watching.
  rpc StopMirrorStream(StopMirrorStreamRequest) returns (StopMirrorStreamResponse);
  rpc GetMirrorStream(GetMirrorStreamRequest) returns (GetMirrorStreamResponse);
  // GetMirrorCapacity reads the plane's device-session bound. It reads; it never
  // opens, negotiates or ends anything.
  rpc GetMirrorCapacity(GetMirrorCapacityRequest) returns (GetMirrorCapacityResponse);
}
