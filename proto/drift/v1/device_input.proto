syntax = "proto3";

package drift.v1;

import "drift/v1/action.proto";
import "drift/v1/common.proto";

option go_package = "drift.local/drift-next/gen/go/drift/v1;driftv1";

// A refused device input, as the dispatch boundary reports it.
//
// The dispatch boundary's refusal vocabulary is deliberately finer grained than
// the action-safety kernel's. The kernel reports one lease/fence conflict, while
// an operator needs to know whether the lease expired, the fencing token was
// fenced, the control session ended, or the transport is unusable. Several of
// those reasons share one platform code, so a caller that reads only the Connect
// code cannot tell them apart, and "the tap was refused" is not an answer an
// operator surface can act on.
//
// The reason is the typed discriminator: it is the one field a client must read.
// `code` and `failure_class` mirror the boundary's own stable vocabulary and are
// carried so a client can classify a refusal without maintaining a lookup table
// of its own. `message` is the boundary's fixed operator-facing sentence for
// that reason — never a device, transport, database or stack-trace diagnostic.
//
// A refusal is reported only for an input that did not reach a device in a way
// the kernel authorized. It is never a success, and a caller must never treat a
// missing refusal as evidence that an input was delivered.
message DeviceInputRefusal {
  DeviceInputRefusalReason reason = 1;
  string code = 2;
  string failure_class = 3;
  string message = 4;
}

// DeviceInputRefusalReason is the dispatch boundary's stable refusal vocabulary.
//
// Each value is a distinct operator situation with its own remediation, and the
// set is deliberately not collapsed: a caller that cannot distinguish an expired
// lease from a fenced token from a dead control session retries blindly. A new
// reason is added here as a new value and never by reusing or renaming an
// existing one, because a client's handling of a reason is part of the contract.
enum DeviceInputRefusalReason {
  DEVICE_INPUT_REFUSAL_REASON_UNSPECIFIED = 0;
  // No lease was supplied for the device at all.
  DEVICE_INPUT_REFUSAL_REASON_LEASE_MISSING = 1;
  // The lease exists but its expiry has passed.
  DEVICE_INPUT_REFUSAL_REASON_LEASE_EXPIRED = 2;
  // The lease is held by another controller.
  DEVICE_INPUT_REFUSAL_REASON_LEASE_NOT_HELD = 3;
  // The supplied fencing token is stale or revoked.
  DEVICE_INPUT_REFUSAL_REASON_FENCE_STALE = 4;
  // The control session that carried the lease has ended.
  DEVICE_INPUT_REFUSAL_REASON_NO_CONTROL_SESSION = 5;
  // A lease or fence conflict that the finer reasons above do not name.
  DEVICE_INPUT_REFUSAL_REASON_LEASE_CONFLICT = 6;
  // The emergency stop is engaged: no further input is dispatched.
  DEVICE_INPUT_REFUSAL_REASON_EMERGENCY_STOP = 7;
  // Policy denies this input for this actor, device or surface.
  DEVICE_INPUT_REFUSAL_REASON_POLICY_DENIED = 8;
  // The device cannot execute the requested capability.
  DEVICE_INPUT_REFUSAL_REASON_CAPABILITY_MISMATCH = 9;
  // The device's transport is not attached.
  DEVICE_INPUT_REFUSAL_REASON_DEVICE_OFFLINE = 10;
  // The device is attached but the host is not authorized to control it.
  DEVICE_INPUT_REFUSAL_REASON_DEVICE_UNAUTHORIZED = 11;
  // The transport is reachable but unusable for this input.
  DEVICE_INPUT_REFUSAL_REASON_DEVICE_UNAVAILABLE = 12;
  // The idempotency key was already used for a different request.
  DEVICE_INPUT_REFUSAL_REASON_DUPLICATE_IDEMPOTENCY_KEY = 13;
  // The lease was ended by its control session or an explicit release.
  DEVICE_INPUT_REFUSAL_REASON_LEASE_RELEASED = 14;
}

// The device input surface.
//
// Each RPC submits exactly one typed device input for one device, and each
// carries the same tuple the action-safety kernel authorizes: the workspace, the
// device, the lease and its fencing token, an idempotency key, the observation
// the input was resolved against, and (where policy requires it) an approval.
// The payload is the published typed payload for that kind — the same `TapInput`,
// `SwipeInput` and `KeyEventInput` messages ActionIntent carries — so this
// surface introduces no second representation of a device input. Typed text is
// the one input whose payload is a reference rather than a value, because content
// has no representation in a generated message at all (see below).
//
// The observation a request names is the observation its input was resolved
// against, and for a live frame that is that frame's own live stream: an
// operator points at a picture the stream carried, in the frame the stream is
// encoded at, so the stream is what the point belongs to. The plane does not take
// that on the caller's word. The live session is the one that knows which stream
// it is, so the delivery reconciles the token with the stream the input is
// written to and refuses an input naming any other observation — another
// device's stream, a stream this device has left, a captured observation, or
// none at all — as a precondition failure of its own, before the input reaches
// the device. The field is therefore a fact the plane checks, not a label the
// caller asserts, and the check is not the render space's own comparison of the
// two tokens the caller supplied.
//
// A refused input answers with a Connect error whose code comes from the
// boundary's stable vocabulary and which carries a DeviceInputRefusal detail. A
// successful input answers with an ActionResult: the outcome, and the attempt it
// belongs to. There is no response that reports success for an input the device
// did not receive.
//
// Typed text now has an RPC here, and it carries no content to do it. Its value
// is registered on the control plane's own local content surface
// (`POST /local/text-references/<handle>`, ADR-0015) as a request BODY, and this
// request names the value only by the opaque handle that registration returned.
// A generated message renders every populated field in its string, text, JSON and
// debug forms with no per-field redaction available, so a field can never be
// where operator content enters the process; a value is released at dispatch, in
// the workspace that registered it, and used exactly once.
//
// App launch (ACTION_KIND_LAUNCH_APP) remains deliberately **absent**: it carries
// its target in the intent (ARC-73) without being dispatched here. A route whose
// only possible outcome is a refusal is a control an operator surface will render
// and then find dead, so it is added when the card that makes it dispatchable
// lands rather than exposed as a refusal now.
service DeviceInputService {
  rpc Tap(TapRequest) returns (TapResponse);
  rpc Swipe(SwipeRequest) returns (SwipeResponse);
  rpc KeyEvent(KeyEventRequest) returns (KeyEventResponse);
  rpc TypeText(TypeTextRequest) returns (TypeTextResponse);
}

// The follower fan-out: one operator gesture on the SOURCE frame, carried to each
// follower the operator selected as its own action through the kernel.
//
// The owner's reading of source/follower mirroring is that the followers must also
// RECEIVE what the operator does on the source - watching is the preview fan-out
// that already exists, and receiving is this message. A gesture the operator
// performs on the source is dispatched to the source exactly as it was before, and
// the same typed input is dispatched to each selected follower as its own action:
// in the kernel, that means the follower's own lease, its own policy and capability
// decision, its own fresh observation, its own postcondition, its own evidence
// record and its own result. One follower's outcome can never change another's.
//
// ORDERING is stated here because a client has to be able to rely on it: the
// followers proceed INDEPENDENTLY of the operator's gesture. The source's own
// dispatch is answered from the source's own result, and it never waits for the
// slowest follower - so what this report carries for an accepted follower is the
// ACCEPTANCE of that follower's run, and the follower's own outcome is recorded on
// the plane as its run completes. A gesture on the source must not hang on a
// follower, and a follower that is slow, stuck or unreachable is answered in its
// own row.
//
// The CANDIDATE SET is the plane's own ONLINE reading, made in one place, so a
// device the console paints as online and a device this run treats as online
// cannot disagree. A follower that is not online was never contacted and never
// failed: it is EXCLUDED, NAMED with a reason of its own, and the count this report
// carries is the set the run TARGETED rather than the set the operator selected.
//
// A typed-text gesture and an app launch are deliberately NOT carried to
// followers, and each follower is refused with its own reason rather than being
// silently left out: a text reference is released exactly once, so carrying one
// reference to N followers would be either N releases of one value or one release
// that N devices silently did without, and a launch names one device's package.
message FollowerInputFanout {
  // run_id identifies this fan-out, assigned before anything is dispatched, so a
  // retried fan-out is recognisable as the same gesture.
  string run_id = 1;
  // target_count is the size of the set this run TARGETED: the followers whose own
  // actions it dispatched. It is never the number of followers selected, because a
  // follower that is not online was never contacted and never failed.
  int32 target_count = 2;
  // followers carries one row per follower the operator named, in the order the
  // operator named them, deduplicated by device. Nothing the operator selected is
  // absent from it.
  repeated FollowerInputOutcome followers = 3;
  // acceptance_duration_ms is how long the plane spent resolving and offering
  // every selected follower to the bounded executor. It never includes follower
  // execution: the source response must not wait for the slowest device.
  uint32 acceptance_duration_ms = 4;
}

// FollowerInputDisposition is what happened to ONE follower's copy of the gesture.
//
// It is deliberately four values rather than a boolean. ACCEPTED says the
// follower's action was dispatched through the kernel and the outcome beside it is
// the device's own; REFUSED says the plane decided not to dispatch it and the
// reason beside it is why; EXCLUDED says the follower was never a candidate at all,
// so nothing about it was contacted OR failed; INDETERMINATE says the action was
// dispatched and its outcome could not be established, which is never a success.
message FollowerInputOutcome {
  string device_id = 1;
  FollowerInputDisposition disposition = 2;
  // reason is the plane's own stable reason for this row, so a client adds a value
  // rather than re-deriving one from the outcome text.
  string reason = 3;
  // detail is the plane's own fixed sentence for this row, or the dispatch
  // boundary's own refusal sentence. It never carries device content, a transport
  // diagnostic or a stack trace.
  string detail = 4;
  // refusal is the dispatch boundary's typed refusal, present only for a row the
  // kernel or the readiness probe refused.
  DeviceInputRefusal refusal = 5;
  // outcome is the kernel's own reading for a row that was dispatched.
  string outcome = 6;
  // attempt_id identifies this follower's own action attempt, which is what an
  // append-only evidence record references. Empty for a row that reached no device.
  string attempt_id = 7;
  // idempotency_key is the key this follower's action carries: this follower's OWN,
  // so a retried fan-out does not double-apply on a follower that already took it.
  string idempotency_key = 8;
  // frame_width and frame_height are the render space this follower was given. They
  // are the SOURCE's declared frame, unchanged: this plane refuses a follower that
  // does not present at that frame and never rescales a coordinate into the
  // follower's own size.
  uint32 frame_width = 9;
  uint32 frame_height = 10;
  // acceptance_latency_ms is how long this follower's bounded queue admission
  // took. It is zero for a follower that was excluded before admission.
  uint32 acceptance_latency_ms = 11;
}

// FollowerInputDisposition names what happened to one follower's copy of a gesture.
enum FollowerInputDisposition {
  FOLLOWER_INPUT_DISPOSITION_UNSPECIFIED = 0;
  // The follower's own action was dispatched through the kernel.
  FOLLOWER_INPUT_DISPOSITION_ACCEPTED = 1;
  // The plane did not dispatch this follower's action, and named the reason.
  FOLLOWER_INPUT_DISPOSITION_REFUSED = 2;
  // The follower was not a candidate, so the run never contacted it.
  FOLLOWER_INPUT_DISPOSITION_EXCLUDED = 3;
  // The action was dispatched and its outcome could not be established.
  FOLLOWER_INPUT_DISPOSITION_INDETERMINATE = 4;
}

// TapRequest submits one tap: a semantic target, or a point inside
// the render space it was measured in. A tap that names neither, or both, is
// refused before the kernel is asked.
message TapRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  string device_id = 3;
  string lease_id = 4;
  uint64 fencing_token = 5;
  string idempotency_key = 6;
  // observation_token names the observation the tap was resolved against: the
  // live stream that carries it, for a tap a session delivers. It must equal the
  // render space's own token, and the plane refuses it when what it names is not
  // the stream the tap is delivered on (see DeviceInputService).
  string observation_token = 7;
  TapInput tap = 8;
  bool approval_granted = 9;
  // follower_device_ids are the followers the operator selected when the gesture
  // was performed on the SOURCE frame. Each one receives the same typed input as
  // its own action through the kernel (see FollowerInputFanout). An empty list
  // means the gesture is the source's alone, exactly as it was before.
  repeated string follower_device_ids = 10;
}

message TapResponse {
  ActionResult result = 1;
  // fanout reports the followers this gesture was carried to, one row each. It is
  // present whenever followers were named, including when none of them was a
  // candidate, because a report that went missing would read as a fan-out that
  // never happened.
  FollowerInputFanout fanout = 2;
}

// SwipeRequest submits one swipe. Both endpoints belong to the one
// render space carried with the request, and that frame is required.
message SwipeRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  string device_id = 3;
  string lease_id = 4;
  uint64 fencing_token = 5;
  string idempotency_key = 6;
  // observation_token names the observation the swipe was resolved against: the
  // live stream that carries it, for a swipe a session delivers. It must equal
  // the render space's own token, and the plane refuses it when what it names is
  // not the stream the swipe is delivered on.
  string observation_token = 7;
  SwipeInput swipe = 8;
  bool approval_granted = 9;
  // follower_device_ids are the followers the operator selected when the gesture
  // was performed on the SOURCE frame. Each one receives the same typed input as
  // its own action through the kernel (see FollowerInputFanout). An empty list
  // means the gesture is the source's alone, exactly as it was before.
  repeated string follower_device_ids = 10;
}

message SwipeResponse {
  ActionResult result = 1;
  FollowerInputFanout fanout = 2;
}

// KeyEventRequest submits one key event. It carries a bounded key
// code from the device's key vocabulary and no command text.
message KeyEventRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  string device_id = 3;
  string lease_id = 4;
  uint64 fencing_token = 5;
  string idempotency_key = 6;
  // observation_token names the observation the key event was resolved against:
  // the live stream that carries it, for a key event a session delivers. A key
  // event states no render space — it carries no coordinate — so there is no
  // second token to agree with, and the plane still refuses this one when what
  // it names is not the stream the key event is delivered on. A key event that
  // names none is refused as well: the catalog requires an observation from this
  // kind, and the transport's validation is never relaxed to admit a request
  // that does not satisfy it.
  string observation_token = 7;
  KeyEventInput key_event = 8;
  bool approval_granted = 9;
  // follower_device_ids are the followers the operator selected when the gesture
  // was performed on the SOURCE frame. Each one receives the same typed input as
  // its own action through the kernel (see FollowerInputFanout). An empty list
  // means the gesture is the source's alone, exactly as it was before.
  repeated string follower_device_ids = 10;
}

message KeyEventResponse {
  ActionResult result = 1;
  FollowerInputFanout fanout = 2;
}

// TypeTextRequest submits one typed-text entry. Its value is NOT here: it names
// the opaque handle a registration returned, and the length of the value that
// handle holds, so a caller can bound what it is about to type without either
// boundary reading the content. `SensitiveTextReference` has no field for
// content for the same reason this request has none.
//
// There is no observation token and no coordinate frame, and that is the truth
// rather than an omission: typed content carries no coordinate, so there is
// nothing for it to be measured in and nothing to cross-check against the render
// size. It belongs to the workspace that registered it, which is the scope the
// value is released in.
message TypeTextRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  string device_id = 3;
  string lease_id = 4;
  uint64 fencing_token = 5;
  string idempotency_key = 6;
  // text is the reference whose value is released at dispatch, exactly once, in
  // the workspace above. A reference that was never registered, that was already
  // released, or that has expired is refused; its value reaches no device.
  SensitiveTextReference text = 7;
  bool approval_granted = 8;
}

message TypeTextResponse {
  ActionResult result = 1;
}
