syntax = "proto3";

package drift.v1;

import "drift/v1/common.proto";

option go_package = "drift.local/drift-next/gen/go/drift/v1;driftv1";

// Device is the operator-facing projection of an edge-managed Android device.
//
// The device command surface is not a raw passthrough and not a generic shell:
// a device input is permitted only as one of the typed, first-class actions in
// action.proto, and only through the lease, fencing-token, idempotency, policy,
// capability, control-session and emergency-stop kernel that authorizes and
// dispatches it (see `ActionService.Authorize`/`Dispatch` and `HaltService`).
// The earlier deferral — commands absent until leases and policy checks were
// wired — is lifted, and recorded in docs/adr/0008-typed-device-input.md; the
// action-safety kernel itself is unchanged by that lift. No member of this
// service executes caller-supplied command text, and none may be added.
message Device {
  string id = 1;
  string display_name = 2;
  string agent_id = 3;
  DeviceStatus status = 4;
  string platform_version = 5;
  uint32 battery_percent = 6;
  uint32 latency_ms = 7;
  string last_seen_at = 8;
  WorkspaceRef workspace = 9;
  string endpoint_id = 10;
  uint64 row_version = 11;
  // transport is how this device is currently reachable: over USB, or over TCP
  // at the endpoint named by endpoint_id. It is a recorded observation, read
  // back from the endpoint registry, and never derived by a client from the
  // shape of an endpoint address — a client that reconstructs it can disagree
  // with the observation it is reporting on.
  //
  // It is reported for EVERY device that has a current endpoint, whether or not
  // that transport was usable: a device attached over USB and not yet authorized
  // is attached over USB, and a surface that answers "no transport" about a unit
  // that is plugged in cannot show it at all (ARC-196).
  DeviceTransport transport = 12;
}

enum DeviceStatus {
  DEVICE_STATUS_UNSPECIFIED = 0;
  // DEVICE_STATUS_ONLINE: observed at a current endpoint whose transport
  // reported the device as usable.
  DEVICE_STATUS_ONLINE = 1;
  // DEVICE_STATUS_ATTENTION is a lifecycle reading no producer emits; it stays
  // published for consumers that still map it.
  DEVICE_STATUS_ATTENTION = 2;
  // DEVICE_STATUS_OFFLINE: observed before and not observed now, or observed at
  // a current transport that is listed but not answering.
  DEVICE_STATUS_OFFLINE = 3;
  // DEVICE_STATUS_UNAUTHORIZED: ATTACHED at its current transport, and this host
  // is not authorized by the device — the device's own debugging prompt has not
  // been accepted. It is not reachable for work, and it is not gone: no host can
  // accept that prompt for the device, so the device has to be authorized once
  // on its own display (or by a key placed on it) before anything can be
  // dispatched to it.
  DEVICE_STATUS_UNAUTHORIZED = 4;
  // DEVICE_STATUS_NO_PERMISSIONS: ATTACHED at its current transport and this
  // host may not open it at all. It is a host-side condition an operator can fix
  // on the host, and it is deliberately not folded into UNAUTHORIZED: the two
  // need different things done, and only one of them is fixable at this machine.
  DEVICE_STATUS_NO_PERMISSIONS = 5;
}

// DeviceTransport is the transport a device was observed over.
//
// It is a fact about the transport and not a device lifecycle: a device has no
// lifecycle beyond its identity and its observation history, so nothing here is
// a state an operator advances.
enum DeviceTransport {
  // A device whose current endpoint carries no observed transport, or a device
  // with no current endpoint at all. It is reported as unspecified rather than
  // guessed into one of the transports below.
  DEVICE_TRANSPORT_UNSPECIFIED = 0;
  DEVICE_TRANSPORT_USB = 1;
  DEVICE_TRANSPORT_TCP = 2;
}

message ListDevicesRequest {
  string organization_id = 1;
  WorkspaceRef workspace = 2;
  PageRequest page = 3;
}

message ListDevicesResponse {
  repeated Device devices = 1;
  PageResponse page = 2;
}

message GetDeviceRequest {
  string organization_id = 1;
  string device_id = 2;
  WorkspaceRef workspace = 3;
}

message GetDeviceResponse {
  Device device = 1;
}

service DeviceService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse);
}
