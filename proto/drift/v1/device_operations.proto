syntax = "proto3";

package drift.v1;

import "drift/v1/common.proto";

option go_package = "drift.local/drift-next/gen/go/drift/v1;driftv1";

// The big-frame control panel's device-operation surface.
//
// Every command the panel renders for the SELECTED device dispatches one of
// these operations, on that one device, through the same lease / fencing /
// policy / control-session kernel every other state-changing device action
// travels. A command that cannot act is not rendered (AGENTS.md section 7), so
// this contract is the whole of what the panel can do rather than a subset of
// it with a toast for the rest.
//
// This contract carries NO COMMAND TEXT, and there is no field or combination
// of fields in it in which a command string could travel:
//
//   - `DeviceOperation` is a CLOSED enum naming a reviewed operation. Each
//     member has one fixed argument array on the device side, admitted by the
//     device adapter's own recogniser, and the set is closed because a caller
//     that could name another operation could name any operation.
//   - A file operation is addressed by a bounded file NAME inside the ONE
//     device directory this product owns (`/sdcard/drift-inbox`). The path is
//     composed by the control plane and the name carries no separator, no
//     parent and no shell character, so a file operation cannot address the
//     device's own storage, a shared directory or a second file.
//   - A file operation's SOURCE is an artifact this workspace already holds
//     (`artifact_id`), never a host path, and its destination on the device is
//     the directory above, never a path a caller supplies.
//   - A package install names the package (`package_name`, the same bounded
//     name an app launch already admits) and the artifact holding its bytes.
//   - Reboot and Switch Keyboard carry NO parameter at all: the reboot's
//     argument array is the operation's own, and which keyboard to switch to is
//     chosen by the control plane from the DEVICE's own enabled-IME list and
//     stated in the row it reports, rather than asked of the operator.
//
// The ADVANCED form is the ONE member of this contract that carries operator
// content, and it is a SEPARATE RPC with a request type of its own
// (`RunAdvancedCommand`): an operator-entered argument array, carried as
// discrete repeated `argv` entries rather than as one joined command string, so
// each argument stays visibly separate in the audit record. It is admitted only
// after the operator confirms the EXACT array carried in the request, it is
// spawned without a shell, it refuses an absolute host path outside the set
// this product admits, and it lands an append-only audit record naming the
// argument array, the actor, the device and the outcome. There is no request in
// which a catalogued operation and an operator-entered array could both be
// named, and a catalogued request cannot reach it.

// DeviceOperation names one reviewed device operation this surface can run.
// It is a reviewed operation, not a command: each member has one fixed argument
// array on the device side, and the set is closed because a caller that could
// name another operation could name any operation.
enum DeviceOperation {
  DEVICE_OPERATION_UNSPECIFIED = 0;
  // Reboot restarts the device. Its argument array carries no caller value at
  // all, and its postcondition is the DEPARTURE a transport observer reads
  // inside a bounded settle window: a command that exited zero and a device
  // that never left is not a reboot.
  DEVICE_OPERATION_REBOOT = 1;
  // Switch Keyboard moves the device to another of its own enabled input
  // methods. The component is chosen by the control plane from the device's
  // own `ime list -s` answer and written as a single bounded component NAME,
  // and the device's own `secure default_input_method` is read back as the
  // postcondition.
  DEVICE_OPERATION_KEYBOARD_SWITCH = 2;
  // Install Package pushes a package's bytes into the one device directory
  // this product owns, installs it, and asks the device where the package's
  // code now is. The postcondition is the DEVICE's own `pm path` answer.
  DEVICE_OPERATION_INSTALL_APK = 3;
  // Import File writes an artifact this workspace holds onto the device, at a
  // path composed from a bounded file name, and reads the destination's size
  // back off the device as its postcondition.
  DEVICE_OPERATION_IMPORT_FILE = 4;
  // Export File reads one file out of the device directory this product owns
  // into the artifact store. It changes nothing on the device: its
  // postcondition is an artifact written from the bytes the device answered
  // with, at the size the device itself reported for that path.
  DEVICE_OPERATION_EXPORT_FILE = 5;
}

// DeviceOperationRefusalReason is this boundary's stable vocabulary for an
// operation that was NOT completed on one device.
//
// Each value is a distinct operator situation with its own remediation, so the
// set is deliberately not collapsed into one failure: "another controller holds
// this device's lease" and "the device answered and does not report the
// operation's postcondition holding" send an operator to two different places.
// A new reason is added as a new value and never by reusing or renaming an
// existing one, because a client's handling of a reason is part of the
// contract.
enum DeviceOperationRefusalReason {
  DEVICE_OPERATION_REFUSAL_REASON_UNSPECIFIED = 0;
  // The device has no single current transport endpoint, so there is no serial
  // to reach it at. Nothing was sent.
  DEVICE_OPERATION_REFUSAL_REASON_NO_TRANSPORT_SERIAL = 1;
  // The device's own lease could not be acquired: another controller holds it.
  DEVICE_OPERATION_REFUSAL_REASON_LEASE_UNAVAILABLE = 2;
  // The lease existed but its expiry had passed.
  DEVICE_OPERATION_REFUSAL_REASON_LEASE_EXPIRED = 3;
  // The supplied fencing token was stale or revoked.
  DEVICE_OPERATION_REFUSAL_REASON_FENCE_STALE = 4;
  // The control session that carried the lease has ended.
  DEVICE_OPERATION_REFUSAL_REASON_NO_CONTROL_SESSION = 5;
  // A lease or fence conflict the finer reasons above do not name.
  DEVICE_OPERATION_REFUSAL_REASON_LEASE_CONFLICT = 6;
  // The device's transport is not attached.
  DEVICE_OPERATION_REFUSAL_REASON_DEVICE_OFFLINE = 7;
  // The device is attached but the host is not authorized to control it.
  DEVICE_OPERATION_REFUSAL_REASON_DEVICE_UNAUTHORIZED = 8;
  // The transport is reachable but unusable.
  DEVICE_OPERATION_REFUSAL_REASON_DEVICE_UNAVAILABLE = 9;
  // Policy denies this operation for this actor, device or surface.
  DEVICE_OPERATION_REFUSAL_REASON_POLICY_DENIED = 10;
  // The device cannot execute the capability this operation requires.
  DEVICE_OPERATION_REFUSAL_REASON_CAPABILITY_MISMATCH = 11;
  // The emergency stop is engaged: no further action is dispatched.
  DEVICE_OPERATION_REFUSAL_REASON_EMERGENCY_STOP = 12;
  // The idempotency key was already used for a different request.
  DEVICE_OPERATION_REFUSAL_REASON_DUPLICATE_IDEMPOTENCY_KEY = 13;
  // The device ran the operation's command and refused it. Whether anything
  // changed is UNKNOWN, and it is not reported as applied.
  DEVICE_OPERATION_REFUSAL_REASON_COMMAND_FAILED = 14;
  // The device answered and its own read-back does not show the operation's
  // postcondition holding. This is a failure even though the command exited
  // zero, and it is the reason the read-back exists.
  DEVICE_OPERATION_REFUSAL_REASON_POSTCONDITION_FAILED = 15;
  // The attempt reached the device and its outcome could not be observed, so it
  // is reported as indeterminate rather than as either answer.
  DEVICE_OPERATION_REFUSAL_REASON_OUTCOME_INDETERMINATE = 16;
  // The device this request named is not in the workspace's registry at all, so
  // there is no device to resolve a transport for and nothing was sent. It is a
  // reason of its own rather than NO_TRANSPORT_SERIAL: "a device I know about
  // and cannot reach" and "a device this plane has never recorded" send an
  // operator to two different places.
  DEVICE_OPERATION_REFUSAL_REASON_DEVICE_NOT_REGISTERED = 17;
  // This workspace holds no bytes for the artifact the operation named, so
  // there was nothing to send. It is a reason of its own rather than a device
  // failure: the operator's next step is to store the file, not to look at the
  // device.
  DEVICE_OPERATION_REFUSAL_REASON_ARTIFACT_UNAVAILABLE = 18;
  // The file name is not a bounded name this product addresses, so nothing was
  // sent.
  DEVICE_OPERATION_REFUSAL_REASON_FILE_NAME_INVALID = 19;
  // The device reported no enabled keyboard, so there is nothing to switch to.
  DEVICE_OPERATION_REFUSAL_REASON_NO_ENABLED_KEYBOARD = 20;
  // The ADVANCED form's argument array was not confirmed by the operator, so
  // nothing was dispatched.
  DEVICE_OPERATION_REFUSAL_REASON_NOT_CONFIRMED = 21;
  // The ADVANCED form's argument array names an absolute host path outside the
  // set this product admits, so nothing was dispatched.
  DEVICE_OPERATION_REFUSAL_REASON_HOST_PATH_REFUSED = 22;
  // The request is not one this product dispatches - an argument array over its
  // bound, a token that is not a safe argv token, or a command name that is a
  // path, a flag or a quoted string. Nothing was sent.
  DEVICE_OPERATION_REFUSAL_REASON_REQUEST_INVALID = 23;
  // The file was read off the device and its bytes were not admissible to this
  // workspace's artifact store, so nothing was kept. It is a reason of its own
  // rather than a device failure: nothing about the device is wrong, and an
  // operator's next step is a policy decision.
  DEVICE_OPERATION_REFUSAL_REASON_CONTENT_REFUSED = 24;
}

// DeviceOperationResult is ONE operation's outcome for ONE device.
message DeviceOperationResult {
  // device_id is the device this row is about, as the registry names it. It is
  // the typed device identity, not the transport serial.
  string device_id = 1;
  // operation names the operation this row reports.
  DeviceOperation operation = 2;
  // applied is true only when the operation dispatched, the device answered,
  // AND the device's own read-back shows the operation's postcondition holding.
  // A command that exited zero is not this.
  bool applied = 3;
  // verified reports that a read-back was taken, so this row's answer is a fact
  // read off the device rather than a report that a command ran.
  bool verified = 4;
  // refusal names why this row is not applied, and is UNSPECIFIED when it is.
  DeviceOperationRefusalReason refusal = 5;
  // failure_class is the shared failure vocabulary's classification of this
  // row, and is empty when the row is applied. A client branches on it rather
  // than parsing the sentence.
  string failure_class = 6;
  // message is this boundary's fixed operator-facing sentence for this row. It
  // is never a device, transport, database or stack-trace diagnostic, and it
  // never quotes command text or a device-side payload.
  string message = 7;
  // detail states what the DEVICE answered, in this boundary's own words, for
  // the operations whose value to an operator is that answer: the keyboard
  // component a switch chose, the size the device reported for a file, the code
  // path a package resolved to, the artifact an export wrote. It is never
  // device output, never a path a caller supplied and never command text.
  string detail = 8;
  // artifact_id names the artifact an export stored, and is empty otherwise.
  string artifact_id = 9;
  // argv is the exact argument array an ADVANCED form dispatched, one entry per
  // discrete argument. It is the only field on this message that can carry
  // operator-entered content, and it is populated for that one operation.
  repeated string argv = 10;
}

// RunDeviceOperationRequest runs ONE catalogued operation on ONE named device.
//
// The device is named by its REGISTRY identity, never a transport serial: the
// serial the operation travels over is resolved by the control plane from its
// own current-endpoint projection, so a caller cannot assert where a device is
// and cannot send an operation at a transport the plane has not observed.
message RunDeviceOperationRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  // device_id is the registry identity of the device to run the operation on.
  // It is resolved against the workspace's own registry, and a device that is
  // not in it is refused rather than resolved to another device.
  string device_id = 3;
  // operation names the one operation to run. UNSPECIFIED, or a value that is
  // not a member of the closed enum, is refused before anything runs.
  DeviceOperation operation = 4;
  // file_name is the bounded file NAME an import, an export or an install
  // addresses inside the one device directory this product owns. It is a name
  // and NOT a path: a name carrying a separator, a parent, a root or any shell
  // character is refused rather than composed into a path.
  string file_name = 5;
  // artifact_id names the artifact whose bytes an import or an install sends.
  // It is an artifact this workspace holds, resolved by the boundary that owns
  // the artifact store, so no host path ever reaches this contract.
  string artifact_id = 6;
  // media_type is the media type an export stores the bytes it pulled under.
  // It is metadata about stored content, never a path and never content.
  string media_type = 7;
  // package_name is the package an install asks the device about afterwards,
  // and the same bounded package name an app launch already admits.
  string package_name = 8;
  // approval_granted is the operator's explicit approval of the change. A
  // high-risk operation - a reboot, an install, an import - is refused by the
  // policy evaluator without it, and that refusal is reported on this row. It
  // is required rather than defaulted so a client has to have asked.
  bool approval_granted = 9;
}

// RunDeviceOperationResponse reports the one operation's outcome for the one
// device.
message RunDeviceOperationResponse {
  DeviceOperationResult result = 1;
}

// RunAdvancedCommandRequest is the ADVANCED form of AGENTS.md section 3: an
// operator-entered argument array for one device, dispatched only after the
// operator confirmed the EXACT array carried here.
//
// It is a request type of its own rather than a field of the catalogued request
// above, so there is no request in which a catalogued operation and an
// operator-entered array could both be named, and no catalogued request can
// reach the advanced path.
//
// The array is a REPEATED STRING of discrete arguments, never one joined
// command string: each argument is visibly separate in the audit record, and
// the adapter spawns the array WITHOUT a shell, so no position is ever parsed
// as shell text, a metacharacter, a quote or a second command.
message RunAdvancedCommandRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  // device_id is the registry identity of the device to run the array on.
  string device_id = 3;
  // argv is the operator's argument array, one discrete argument per entry.
  repeated string argv = 4;
  // confirmed reports that the operator confirmed the EXACT array carried in
  // this request. It is required rather than defaulted: an array nobody
  // confirmed reaches nothing, and the refusal says so.
  bool confirmed = 5;
  // approval_granted is the operator's explicit approval. The advanced form is
  // the highest-risk kind this product dispatches, so it is a separate act from
  // confirming the array rather than folded into it.
  bool approval_granted = 6;
}

// RunAdvancedCommandResponse reports the advanced form's outcome, including the
// exact argument array that was dispatched and the exit status the device
// answered it with.
message RunAdvancedCommandResponse {
  DeviceOperationResult result = 1;
}

service DeviceOperationsService {
  // RunDeviceOperation runs ONE catalogued operation on ONE named device,
  // through the lease / fencing / policy / control-session kernel, and reports
  // the device's own read-back as its postcondition.
  rpc RunDeviceOperation(RunDeviceOperationRequest) returns (RunDeviceOperationResponse);
  // RunAdvancedCommand runs an operator-entered argument array on ONE named
  // device after the operator confirmed the exact array. It is a separate
  // entry point from every catalogued operation, with its own recogniser, its
  // own confirmation and its own append-only audit record.
  rpc RunAdvancedCommand(RunAdvancedCommandRequest) returns (RunAdvancedCommandResponse);
}
