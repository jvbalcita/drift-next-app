syntax = "proto3";
package drift.v1;

import "drift/v1/common.proto";

option go_package = "drift.local/drift-next/gen/go/drift/v1;driftv1";

enum LeaseState {
  LEASE_STATE_UNSPECIFIED = 0;
  LEASE_STATE_REQUESTED = 1;
  LEASE_STATE_ACTIVE = 2;
  LEASE_STATE_RELEASED = 3;
  LEASE_STATE_EXPIRED = 4;
  LEASE_STATE_REVOKED = 5;
}
message DeviceLease {
  string id = 1;
  WorkspaceRef workspace = 2;
  string device_id = 3;
  string control_session_id = 4;
  LeaseState state = 5;
  uint64 fencing_token = 6;
  string expires_at = 7;
  string holder_id = 8;
}
message ListDeviceLeasesRequest {
  WorkspaceRef workspace = 1;
  PageRequest page = 2;
}
message ListDeviceLeasesResponse {
  repeated DeviceLease leases = 1;
  PageResponse page = 2;
}
message AcquireDeviceLeaseRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
  string device_id = 3;
  string control_session_id = 4;
}
message AcquireDeviceLeaseResponse {
  DeviceLease lease = 1;
}
message RenewDeviceLeaseRequest {
  RequestContext context = 1;
  ResourceRef lease = 2;
  uint64 fencing_token = 3;
}
message RenewDeviceLeaseResponse {
  DeviceLease lease = 1;
}
message ReleaseDeviceLeaseRequest {
  RequestContext context = 1;
  ResourceRef lease = 2;
  uint64 fencing_token = 3;
}
message ReleaseDeviceLeaseResponse {
  DeviceLease lease = 1;
}
enum ControlSessionState {
  CONTROL_SESSION_STATE_UNSPECIFIED = 0;
  CONTROL_SESSION_STATE_REQUESTED = 1;
  CONTROL_SESSION_STATE_ACTIVE = 2;
  CONTROL_SESSION_STATE_CLOSING = 3;
  CONTROL_SESSION_STATE_CLOSED = 4;
  CONTROL_SESSION_STATE_EXPIRED = 5;
  CONTROL_SESSION_STATE_REVOKED = 6;
}
message ControlSession {
  string id = 1;
  WorkspaceRef workspace = 2;
  string holder_id = 3;
  ControlSessionState state = 4;
  string created_at = 5;
  string expires_at = 6;
}
message OpenControlSessionRequest {
  RequestContext context = 1;
  WorkspaceRef workspace = 2;
}
message OpenControlSessionResponse {
  ControlSession session = 1;
}
message CloseControlSessionRequest {
  RequestContext context = 1;
  ResourceRef session = 2;
}
message CloseControlSessionResponse {
  ControlSession session = 1;
}
message ListControlSessionsRequest {
  WorkspaceRef workspace = 1;
  PageRequest page = 2;
}
message ListControlSessionsResponse {
  repeated ControlSession sessions = 1;
  PageResponse page = 2;
}
service LeaseService {
  rpc AcquireDeviceLease(AcquireDeviceLeaseRequest) returns (AcquireDeviceLeaseResponse);
  rpc RenewDeviceLease(RenewDeviceLeaseRequest) returns (RenewDeviceLeaseResponse);
  rpc ReleaseDeviceLease(ReleaseDeviceLeaseRequest) returns (ReleaseDeviceLeaseResponse);
  rpc ListDeviceLeases(ListDeviceLeasesRequest) returns (ListDeviceLeasesResponse);
  rpc OpenControlSession(OpenControlSessionRequest) returns (OpenControlSessionResponse);
  rpc CloseControlSession(CloseControlSessionRequest) returns (CloseControlSessionResponse);
  rpc ListControlSessions(ListControlSessionsRequest) returns (ListControlSessionsResponse);
}
