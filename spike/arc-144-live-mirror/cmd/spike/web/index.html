<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARC-144 live-mirror latency spike</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 8px; background: #101114; color: #e8e8ea;
         font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .row { display: flex; gap: 8px; }
  .cell { flex: 0 0 auto; }
  h2 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #9aa4b2; }
  video { width: 640px; height: 360px; background: #000; display: block; }
  #log { margin: 8px 0 0; white-space: pre-wrap; color: #8b93a1; max-height: 200px; overflow: hidden; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell">
      <h2>RTP — pion/webrtc H.264 (RFC 6184)</h2>
      <video id="rtpVideo" playsinline muted autoplay></video>
    </div>
    <div class="cell">
      <h2>MSE — fragmented MP4, same bytes</h2>
      <video id="mseVideo" playsinline muted autoplay></video>
    </div>
  </div>
  <pre id="log"></pre>
  <script src="/probe.js"></script>
</body>
</html>
